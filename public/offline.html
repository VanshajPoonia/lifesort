<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · LifeSort</title>
    <style>
      :root {
        --bg: hsl(40 27% 96%);
        --card: hsl(0 0% 100%);
        --text: hsl(36 9% 11%);
        --muted: hsl(36 7% 40%);
        --border: hsl(37 21% 88%);
        --primary: hsl(172 75% 28%);
        --primary-text: hsl(0 0% 100%);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: hsl(255 7% 11%);
          --card: hsl(252 7% 14%);
          --text: hsl(40 19% 91%);
          --muted: hsl(37 6% 55%);
          --border: hsl(250 6% 20%);
          --primary: hsl(170 55% 41%);
          --primary-text: hsl(0 0% 100%);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        padding: 28px 24px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
        text-align: center;
      }
      img { width: 48px; height: 48px; }
      h1 { margin: 16px 0 8px; font-size: 20px; font-weight: 600; }
      p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
      button {
        margin-top: 20px;
        padding: 10px 18px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: var(--primary-text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>LifeSort needs a connection to load your lists. It will open as soon as you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
